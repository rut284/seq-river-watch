<style>
/* Layout: map-led split view. Geographic map on the left; river-line schematics and the gauge board/hydrograph in a side panel. Stacks map-over-panel on phones. */
:root {
  --bg: #eef3f4;
  --panel: #fbfcfc;
  --ink: #102229;
  --ink-2: #3f545c;
  --ink-3: #687c84;
  --rule: #d6e0e3;
  --rule-strong: #b3c2c7;
  --accent: #1c5d99;
  --accent-wash: rgba(28, 93, 153, 0.10);
  --sea: #d3e5ec;
  --land: #f1f2ec;
  --coast: #a9bcc1;
  --river: #3b8bb1;
  --chain: #4f9dc2;
  --water-fill: rgba(59, 139, 177, 0.16);
  --st-below: #2a8a80;
  --st-minor: #f2b01e;
  --st-moderate: #ec7d4a;
  --st-major: #d03b3b;
  --st-none: #97a4a9;
  --on-status: #ffffff;
  --on-minor: #1a1405;
  --marker-ring: #ffffff;
  --marker-shadow: 0 1px 2px rgba(16, 34, 41, 0.45);
  --streets-filter: none;
  --raster-filter: none;
  --banner: #fff4d6;
  --banner-ink: #5a4100;
  --shadow: 0 1px 2px rgba(16, 34, 41, 0.08), 0 4px 16px rgba(16, 34, 41, 0.08);
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1417; --panel: #111c21; --ink: #e4edef; --ink-2: #a7b8bd; --ink-3: #7a8d93;
    --rule: #22333a; --rule-strong: #34474f; --accent: #6fb2e6; --accent-wash: rgba(111, 178, 230, 0.14);
    --sea: #0a1b23; --land: #16232a; --coast: #2d4049; --river: #4b9fc9; --chain: #5db0d6;
    --water-fill: rgba(75, 159, 201, 0.20);
    --st-below: #3aa99c; --st-minor: #f2b01e; --st-moderate: #ee8a5c; --st-major: #e05252; --st-none: #6d7d83;
    --on-status: #ffffff; --on-minor: #1a1405; --banner: #3a2f10; --banner-ink: #f6dc97;
    --marker-ring: #ffffff; --marker-shadow: 0 1px 3px rgba(0, 0, 0, 0.75);
    --streets-filter: invert(1) hue-rotate(180deg) brightness(0.9) contrast(0.88) saturate(0.6); --raster-filter: brightness(0.82);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 16px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1417; --panel: #111c21; --ink: #e4edef; --ink-2: #a7b8bd; --ink-3: #7a8d93;
  --rule: #22333a; --rule-strong: #34474f; --accent: #6fb2e6; --accent-wash: rgba(111, 178, 230, 0.14);
  --sea: #0a1b23; --land: #16232a; --coast: #2d4049; --river: #4b9fc9; --chain: #5db0d6;
  --water-fill: rgba(75, 159, 201, 0.20);
  --st-below: #3aa99c; --st-minor: #f2b01e; --st-moderate: #ee8a5c; --st-major: #e05252; --st-none: #6d7d83;
  --on-status: #ffffff; --on-minor: #1a1405; --banner: #3a2f10; --banner-ink: #f6dc97;
  --marker-ring: #ffffff; --marker-shadow: 0 1px 3px rgba(0, 0, 0, 0.75);
  --streets-filter: invert(1) hue-rotate(180deg) brightness(0.9) contrast(0.88) saturate(0.6); --raster-filter: brightness(0.82);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 16px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { height: 100%; }
body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.45 var(--font-body);
  display: flex; flex-direction: column; min-height: 0;
}
button { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

/* ---------- header */
.top {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--rule);
  background: var(--panel);
}
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; flex-wrap: wrap; }
.brand h1 {
  margin: 0; font: 700 26px/1 var(--font-display); letter-spacing: 0.01em; text-transform: uppercase;
  display: flex; align-items: center; gap: 9px;
}
.brand h1 svg { width: 24px; height: 24px; flex: none; }
.brand p { margin: 0; color: var(--ink-2); font-size: 13.5px; }
.summary { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; align-items: center; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 7px;
  border: 1px solid var(--rule-strong); border-radius: 999px; background: transparent;
  font-size: 13px; line-height: 1.2; cursor: pointer; white-space: nowrap;
}
.chip b { font-family: var(--font-data); font-weight: 500; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-wash); }
.chip:disabled { cursor: default; opacity: .55; }
.swatch { width: 12px; height: 12px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1.5px var(--panel); }
.sw-below { background: var(--st-below); } .sw-minor { background: var(--st-minor); }
.sw-moderate { background: var(--st-moderate); } .sw-major { background: var(--st-major); }
.sw-none { background: var(--st-none); }
.stamp { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
.stamp strong { color: var(--ink-2); font-weight: 500; }
.stamp.stale strong { color: var(--st-major); }

.banner {
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--banner); color: var(--banner-ink); font-size: 13.5px;
  border-bottom: 1px solid var(--rule);
}
.banner b { font-weight: 600; }

/* ---------- main split */
.app { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(360px, 460px); }
.map-wrap { position: relative; min-height: 0; min-width: 0; }
#map { position: absolute; inset: 0; background: var(--sea); }
.panel { min-height: 0; min-width: 0; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--rule); display: flex; flex-direction: column; }

/* map overlays */
.map-legend {
  position: absolute; left: 12px; bottom: 26px; z-index: 500;
  background: var(--panel); color: var(--ink-2); border: 1px solid var(--rule); border-radius: 8px;
  padding: 6px 10px; font-size: 12px; box-shadow: var(--shadow); max-width: 220px;
}
.map-legend summary { cursor: pointer; font-weight: 600; color: var(--ink); padding: 2px 0; }
.map-legend[open] summary { margin-bottom: 4px; }
.legend-body { display: grid; gap: 4px; padding-bottom: 2px; }
.map-legend .row { display: flex; align-items: center; gap: 7px; }
.map-legend .shape { width: 18px; height: 18px; flex: none; display: inline-grid; place-items: center; }
.map-legend .shape svg { display: block; }
.map-legend hr { border: 0; border-top: 1px solid var(--rule); margin: 3px 0; }
.map-tools { position: absolute; right: 12px; top: 12px; z-index: 500; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100% - 64px); }
.tool {
  background: var(--panel); border: 1px solid var(--rule-strong); border-radius: 6px; padding: 5px 10px;
  font-size: 13px; cursor: pointer; box-shadow: var(--shadow);
}
.tool[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.leaflet-container { font: 13px/1.4 var(--font-body); background: var(--sea); }
.leaflet-bar a { background: var(--panel); color: var(--ink); border-bottom-color: var(--rule); }
.leaflet-bar a:hover { background: var(--bg); color: var(--ink); }
.leaflet-bar { border: 1px solid var(--rule-strong) !important; box-shadow: var(--shadow) !important; }
.leaflet-control-attribution { background: color-mix(in srgb, var(--panel) 80%, transparent) !important; color: var(--ink-3); font-size: 10.5px; }
.leaflet-control-attribution a { color: var(--ink-2); }
.leaflet-tooltip.rw-tip {
  background: var(--panel); color: var(--ink); border: 1px solid var(--rule-strong); border-radius: 6px;
  box-shadow: var(--shadow); padding: 6px 9px; font-size: 12.5px; line-height: 1.35; white-space: nowrap;
}
.leaflet-tooltip.rw-tip::before { display: none; }
.rw-tip .t-name { font-weight: 600; }
.rw-tip .t-row { color: var(--ink-2); display: flex; gap: 6px; align-items: center; }
.rw-land { fill: var(--land); fill-opacity: 1; stroke: var(--coast); stroke-width: 1; stroke-opacity: 1; }
.rw-lake { fill: var(--sea); fill-opacity: 1; stroke: var(--river); stroke-width: 0.8; stroke-opacity: .6; }
.rw-river { stroke: var(--river); stroke-width: 2.4; fill: none; stroke-opacity: .55; stroke-linecap: round; stroke-linejoin: round; }
.rw-chain { stroke: var(--chain); stroke-width: 2; fill: none; stroke-opacity: .85; stroke-linecap: round; stroke-linejoin: round; }
.rw-chain.dim { stroke-opacity: .25; }
#map[data-basemap]:not([data-basemap="outline"]) { background: var(--land); }
#map[data-basemap]:not([data-basemap="outline"]) .rw-land,
#map[data-basemap]:not([data-basemap="outline"]) .rw-lake,
#map[data-basemap]:not([data-basemap="outline"]) .rw-river { fill-opacity: 0; stroke-opacity: 0; }
.rw-tiles-streets { filter: var(--streets-filter); }
.rw-tiles-topo, .rw-tiles-aerial { filter: var(--raster-filter); }

const fmtHour = new Intl.DateTimeFormat("en-AU", { timeZone: TZ, hour: "numeric" });
const fmtRow = new Intl.DateTimeFormat("en-AU", { timeZone: TZ, day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false });

const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clsKey = (s) => (s && CLASSES[s.floodClass] ? s.floodClass : "none");
const fmtH = (h) => (h == null ? "—" : h.toFixed(2));
const lower = (s) => (s || "").toLowerCase();

const S = {
  latest: null, history: null, historyLoading: null, byId: new Map(),
  selected: null, view: "rivers", area: "all", q: "", floodOnly: false,
  range: 72, map: null, markers: new Map(), labels: new Map(), chains: [], embedded: null,
  basemap: "outline", available: [], baseLayer: null, basemapBusy: false,
  catch: null, catchOn: false, catchLayers: [],
};

// ------------------------------------------------------------------ small svg helpers
function tendencyPath(t, size = 12) {
  const h = size / 2;
  if (t === "rising") return `<path d="M${h} 1 L${size - 1} ${size - 2} L1 ${size - 2} Z"/>`;
  if (t === "falling") return `<path d="M1 2 L${size - 1} 2 L${h} ${size - 1} Z"/>`;
  return `<circle cx="${h}" cy="${h}" r="${h - 2}"/>`;
}
function arrowSvg(t, cls = "arrow") {
  if (t !== "rising" && t !== "falling") return "";
  return `<svg class="${cls}" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true">${tendencyPath(t)}</svg>`;
}
function pill(key) {
  const c = CLASSES[key];
  const icon = key === "none" ? "" : `<svg viewBox="0 0 12 12" aria-hidden="true">${key === "below"
    ? '<path d="M1 6.5c1.3-1 2.7-1 4 0s2.7 1 4 0 1.7-.6 2-.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>'
    : '<path d="M6 1 L11 10.5 H1 Z" fill="currentColor"/>'}</svg>`;
  return `<span class="pill cls-${key}">${icon}${c.short}</span>`;
}
// A round marker coloured by flood class, with an arrow inside when the river is rising or falling.
function markerGlyph(key, tendency, size, selected) {
  const c = size / 2;
  const r = c - 2;
  const fill = key === "none" ? "var(--panel)" : `var(--st-${key})`;
  const ring = selected ? "var(--accent)" : key === "none" ? "var(--st-none)" : "var(--marker-ring)";
  const ink = key === "minor" ? "var(--on-minor)" : key === "none" ? "var(--ink-2)" : "var(--on-status)";
  const a = r * 0.58;
  let arrow = "";
  if (tendency === "rising") arrow = `<path d="M${c} ${c - a} L${c + a} ${c + a * 0.62} L${c - a} ${c + a * 0.62} Z" fill="${ink}"/>`;
  else if (tendency === "falling") arrow = `<path d="M${c - a} ${c - a * 0.62} L${c + a} ${c - a * 0.62} L${c} ${c + a} Z" fill="${ink}"/>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle class="ring" cx="${c}" cy="${c}" r="${r}" fill="${fill}" stroke="${ring}" stroke-width="${selected ? 3 : 2}"/>${arrow}</svg>`;
}
function markerSize(st, selected) {
  const rank = CLASSES[clsKey(st)].rank;
  return (rank >= 4 ? 28 : rank >= 2 ? 24 : rank === 1 ? 18 : 15) + (selected ? 4 : 0);
}
function markerClass(st, selected = st.id === S.selected) {
  return `rw-marker${CLASSES[clsKey(st)].rank >= 2 || selected ? " keep" : ""}`;
}
function markerSvg(st, selected) {
  const size = markerSize(st, selected);
  return { html: markerGlyph(clsKey(st), st.tendency, size, selected), size };
}

// ------------------------------------------------------------------ time helpers
const minToDate = (m) => new Date(m * 60000);
function nowMs() {
  if (S.latest?.demo) return Date.parse(S.latest.generated);
  return Date.now();
}
function ago(iso) {
  if (!iso) return "";
  const mins = Math.round((nowMs() - Date.parse(iso)) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins} min ago`;
  const h = Math.round(mins / 60);
  if (h < 36) return `${h} h ago`;
  return `${Math.round(h / 24)} days ago`;
}
const tFmt = (iso) => (iso ? fmtTime.format(new Date(iso)).replace(/\s?(am|pm)/i, (m) => m.trim().toLowerCase()) : "—");

// ------------------------------------------------------------------ data loading
function readEmbedded() {
  const el = document.getElementById("embedded-data");
  const txt = el && el.textContent.trim();
  if (!txt) return null;
  try { return JSON.parse(txt); } catch (e) { return null; }
}
async function loadLatest() {
  if (S.embedded) return S.embedded.latest;
  const res = await fetch(`data/latest.json?t=${Date.now()}`, { cache: "no-store" });
  if (!res.ok) throw new Error(`data/latest.json returned ${res.status}`);
  return res.json();
}
// Each gauge's 7-day history is its own small file (data/history/<id>.json), loaded when the
// gauge is opened. Older deployments only had the combined data/history.json.
function loadHistory(id) {
  if (S.embedded) { S.history = S.embedded.history || { series: {} }; return Promise.resolve(S.history); }
  S.history = S.history || { series: {} };
  S.histLoaded = S.histLoaded || {};
  const stamp = S.latest?.generated;
  if (!id || S.histLoaded[id] === stamp) return Promise.resolve(S.history);
  return fetch(`data/history/${encodeURIComponent(id)}.json?t=${encodeURIComponent(stamp || Date.now())}`)
    .then((r) => {
      if (r.ok) return r.json().then((h) => { S.history.series[id] = h.points || []; });
      if (r.status === 404 && !S.histCombined) {
        S.histCombined = true;
        return fetch(`data/history.json?t=${Date.now()}`).then((x) => (x.ok ? x.json() : { series: {} }))
          .then((h) => { Object.assign(S.history.series, h.series || {}); });
      }
      return null;
    })
    .catch(() => null)
    .then(() => { S.histLoaded[id] = stamp; return S.history; });
}

// ------------------------------------------------------------------ filtering
function matches(st) {
  if (S.area !== "all" && st.group !== S.area) return false;
  if (S.floodOnly && CLASSES[clsKey(st)].rank < 2) return false;
  if (S.q) {
    const hay = lower(`${st.name} ${st.waterway} ${st.place} ${st.group}`);
    if (!S.q.split(/\s+/).every((w) => hay.includes(w))) return false;
  }
  return true;
}

// "Latest River Heights for the QLD Gold Coast Rivers; Logan-Albert Rivers; ..." -> "Gold Coast, Logan-Albert ..."
function shortTitle(b) {
  const t = (b && b.title) || "";
  const m = t.match(/for the QLD (.+?)(?: and tributaries)?$/i);
  return m ? m[1].replace(/ Rivers?/g, "").replace(/;\s*/g, ", ").replace(/, ([^,]+)$/, " and $1") : (b && b.product) || "";
}

// ------------------------------------------------------------------ header
function renderHeader() {
  const L = S.latest;
  const counts = Object.fromEntries(ORDER.map((k) => [k, 0]));
  L.stations.forEach((s) => counts[clsKey(s)]++);
  const flooding = counts.major + counts.moderate + counts.minor;
  const chips = ORDER.filter((k) => k !== "none" || counts.none).map((k) =>
    `<span class="chip" style="cursor:default" title="${CLASSES[k].label}"><span class="swatch sw-${k}"></span>${CLASSES[k].short} <b>${counts[k]}</b></span>`);
  chips.unshift(`<button class="chip" id="flood-only" type="button" aria-pressed="${S.floodOnly}" ${flooding ? "" : "disabled"}
    title="Show only gauges at or above minor flood level">At or above minor <b>${flooding}</b></button>`);
  const under = roadsUnderWater().length;
  chips.splice(1, 0, `<button class="chip cx-chip" id="cx-chip" type="button" title="Show bridges, roads and causeways under water">${crossIcon("road")}Crossings under water <b>${under}</b></button>`);
  $("#summary").innerHTML = chips.join("");
  $("#cx-chip").addEventListener("click", () => showView("crossings"));
  const btn = $("#flood-only");
  btn.addEventListener("click", () => { S.floodOnly = !S.floodOnly; btn.setAttribute("aria-pressed", S.floodOnly); applyFilters(); });

  const gen = L.generated;
  const stale = !L.demo && (Date.now() - Date.parse(gen)) > 60 * 60000;
  const stamp = $("#stamp");
  stamp.className = "stamp" + (stale ? " stale" : "");
  stamp.innerHTML = L.demo
    ? `Snapshot <strong>${esc(fmtFull.format(new Date(L.bulletin?.issued || gen)))}</strong>`
    : `Updated <strong>${esc(tFmt(gen))}</strong> · ${esc(ago(gen))}`;

  const banner = $("#banner");
  if (L.demo) {
    banner.innerHTML = `<b>Sample data, not live.</b> Real BoM readings from the bulletins issued ${esc(fmtFull.format(new Date(L.bulletin.issued)))}. Once deployed, this page refreshes from BoM every 15 minutes and fills in flood levels and 7-day histories for every gauge.`;
    banner.hidden = false;
  } else if (stale) {
    banner.innerHTML = `<b>These heights may be out of date.</b> The last update was ${esc(ago(gen))}. BoM's feed or the scheduled update may be delayed. Check the <a href="https://www.bom.gov.au/qld/warnings/">BoM Queensland warnings</a> page.`;
    banner.hidden = false;
  } else banner.hidden = true;
}

// ------------------------------------------------------------------ map
function initMap() {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const map = L.map("map", {
    zoomControl: true, attributionControl: true, zoomAnimation: !reduce, fadeAnimation: !reduce,
    minZoom: 8, maxZoom: 17, zoomSnap: 0.5,
    maxBounds: [[-29.6, 149.2], [-25.0, 155.0]], maxBoundsViscosity: 0.8,
  });
  map.attributionControl.setPrefix(false);
  map.attributionControl.addAttribution('Heights: <a href="https://www.bom.gov.au/" target="_blank" rel="noopener">Bureau of Meteorology</a>');
  S.map = map;
  map.createPane("base"); map.getPane("base").style.zIndex = 300;
  map.createPane("chains"); map.getPane("chains").style.zIndex = 410;
  map.createPane("catchments"); map.getPane("catchments").style.zIndex = 340;
  map.getPane("catchments").style.pointerEvents = "none";
  map.createPane("labels"); map.getPane("labels").style.zIndex = 590;
  map.getPane("labels").style.pointerEvents = "none";
  const geo = S.geo;
  if (geo) {
    L.geoJSON(geo.land, { pane: "base", interactive: false, className: "rw-land" }).addTo(map);
    L.geoJSON(geo.lakes, { pane: "base", interactive: false, className: "rw-lake" }).addTo(map);
    L.geoJSON(geo.rivers, { pane: "base", interactive: false, className: "rw-river" }).addTo(map);
  }
  map.setView([-27.35, 152.75], 9);
  const zoomState = () => {
    const z = map.getZoom();
    $("#map").dataset.zoom = z < 9.5 ? "out" : z < 11 ? "mid" : "in";
  };
  map.on("zoomend", () => { zoomState(); requestAnimationFrame(declutterLabels); });
  ["mousedown", "touchstart", "wheel", "keydown"].forEach((ev) =>
    map.getContainer().addEventListener(ev, () => { S.userMoved = true; }, { passive: true }));
  new ResizeObserver(() => {
    map.invalidateSize({ pan: false });
    if (S.latest && !S.userMoved && !S.selected) fitVisible();
  }).observe(map.getContainer());
  zoomState();
  $("#fit").addEventListener("click", () => fitVisible());
  setOutlineAttribution(true);
  probeBasemaps();
}

// ------------------------------------------------------------------ basemaps
// Free basemaps that need no account or key. Each is offered only if it actually loads
// for this visitor; the built-in outline map is always there as a fallback.
const BASEMAPS = {
  streets: {
    label: "Streets", kind: "vector",
    style: "https://tiles.openfreemap.org/styles/positron",
    attribution: '<a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> © <a href="https://www.openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a> Data from <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>',
  },
  topo: {
    label: "Topo", title: "Queensland Government topographic map", kind: "raster",
    url: "https://spatial-gis.information.qld.gov.au/arcgis/rest/services/Basemaps/QldMap_Topo/MapServer/tile/{z}/{y}/{x}",
    minNativeZoom: 4, maxNativeZoom: 19,
    attribution: 'Topographic map © <a href="https://qldspatial.information.qld.gov.au/" target="_blank" rel="noopener">State of Queensland</a>',
  },
  aerial: {
    label: "Aerial", title: "Queensland Government aerial imagery", kind: "raster",
    url: "https://spatial-img.information.qld.gov.au/arcgis/rest/services/Basemaps/LatestStateProgram_AllUsers/ImageServer/tile/{z}/{y}/{x}",
    minNativeZoom: 0, maxNativeZoom: 20,
    attribution: 'Imagery © <a href="https://qldspatial.information.qld.gov.au/" target="_blank" rel="noopener">State of Queensland</a>',
  },
  outline: { label: "Outline", title: "Simple outline with gauges joined downstream", kind: "outline" },
};
const MAPLIBRE_SCRIPTS = [
  "https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js",
  "https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js",
];
const PROBE_TILE = { z: 10, x: 947, y: 593 }; // central Brisbane

function probeImage(url, ms = 8000) {
  return new Promise((resolve) => {
    const img = new Image();
    const finish = (ok) => { clearTimeout(timer); img.onload = img.onerror = null; resolve(ok); };
    const timer = setTimeout(() => finish(false), ms);
    img.onload = () => finish(img.naturalWidth > 0);
    img.onerror = () => finish(false);
    img.src = url;
  });
}
function probeStyle(url, ms = 8000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, { signal: ctrl.signal }).then((r) => r.ok).catch(() => false).finally(() => clearTimeout(timer));
}
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const el = document.createElement("script");
    el.src = src;
    el.onload = resolve;
    el.onerror = () => reject(new Error(`could not load ${src}`));
    document.head.appendChild(el);
  });
}
function tileUrl(key) {
  const { z, x, y } = PROBE_TILE;
  return BASEMAPS[key].url.replace("{z}", z).replace("{x}", x).replace("{y}", y);
}
function setOutlineAttribution(on) {
  const text = 'Outline: <a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener">Natural Earth</a>';
  if (on) S.map.attributionControl.addAttribution(text); else S.map.attributionControl.removeAttribution(text);
}

async function probeBasemaps() {
  S.basemap = "outline";
  S.available = [];
  const results = await Promise.all([
    probeStyle(BASEMAPS.streets.style).then((ok) => ok && "streets"),
    probeImage(tileUrl("topo")).then((ok) => ok && "topo"),
    probeImage(tileUrl("aerial")).then((ok) => ok && "aerial"),
  ]);
  S.available = results.filter(Boolean);
  let saved = null;
  try { saved = localStorage.getItem("rw-basemap"); } catch (e) { /* storage blocked */ }
  const pick = saved === "outline" || S.available.includes(saved) ? saved : S.available[0] || "outline";
  if (pick !== "outline") await setBasemap(pick);
  else renderBasemapSwitch();
}

async function setBasemap(key) {
  const bm = BASEMAPS[key];
  if (!bm || S.basemapBusy) return;
  S.basemapBusy = true;
  let layer = null;
  try {
    if (bm.kind === "raster") {
      layer = L.tileLayer(bm.url, {
        minNativeZoom: bm.minNativeZoom, maxNativeZoom: bm.maxNativeZoom, maxZoom: 19,
        attribution: bm.attribution, className: `rw-tiles rw-tiles-${key}`,
      });
    } else if (bm.kind === "vector") {
      if (!L.maplibreGL) for (const src of MAPLIBRE_SCRIPTS) await loadScript(src);
      layer = L.maplibreGL({ style: bm.style, attributionControl: { customAttribution: bm.attribution }, className: "rw-tiles rw-tiles-streets", interactive: false });
    }
    if (S.baseLayer) S.map.removeLayer(S.baseLayer);
    S.baseLayer = layer;
    if (layer) layer.addTo(S.map);
  } catch (e) {
    // e.g. WebGL is turned off in this browser: drop this option and use the next one.
    S.basemapBusy = false;
    S.available = S.available.filter((k) => k !== key);
    return setBasemap(S.available[0] || "outline");
  }
  S.basemap = key;
  S.basemapBusy = false;
  $("#map").dataset.basemap = key;
  setOutlineAttribution(key === "outline");
  try { localStorage.setItem("rw-basemap", key); } catch (e) { /* storage blocked */ }
  renderBasemapSwitch();
  renderLegend();
  if (S.latest) { renderMap(); applyFilters(); }
}

function renderBasemapSwitch() {
  const box = $("#basemaps");
  const note = $("#map-note");
  const keys = S.available.length ? [...S.available, "outline"] : [];
  box.hidden = !keys.length;
  box.innerHTML = keys.map((k) => `<button type="button" data-k="${k}" aria-pressed="${S.basemap === k}" title="${esc(BASEMAPS[k].title || BASEMAPS[k].label)}">${BASEMAPS[k].label}</button>`).join("");
  box.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => setBasemap(b.dataset.k)));
  note.hidden = keys.length > 0;
  note.textContent = S.latest?.demo || S.embedded
    ? "Street, topographic and aerial maps appear on the live site."
    : "Street and aerial maps couldn't load, so a simple outline is shown.";
}

function crossingLabels() {
  const out = [];
  S.latest.stations.forEach((s) => {
    if (s.lat == null || !matchesPlace(s)) return;
    const hits = (s.crossings || []).filter((c) => c.kind === "road").map((c) => ({ c, cs: crossingState(s, c) }))
      .filter((x) => x.cs.state === "over" || x.cs.state === "near").sort((a, b) => b.cs.diff - a.cs.diff);
    if (hits.length) out.push({ s, ...hits[0] });
  });
  return out;
}
function renderLabels() {
  if (S.view === "crossings") {
    S.labels.forEach((l) => S.map.removeLayer(l));
    S.labels.clear();
    crossingLabels().forEach(({ s, c, cs }) => {
      const size = markerSize(s, s.id === S.selected);
      const html = `<span class="rw-label-in cx-${cs.state}">${crossIcon(c.kind)}<b class="num">${fmtDiff(cs.diff)} m</b> ${esc(crossName(c))}, ${esc(s.place || s.name)}${s.unusual ? " (check)" : ""}</span>`;
      const icon = L.divIcon({ className: `rw-label cxl ${cs.state === "over" ? "r-major" : "r-minor"}`, html, iconSize: null, iconAnchor: [-(size / 2 + 5), 12] });
      const lab = L.marker([s.lat, s.lon], { icon, pane: "labels", interactive: false, keyboard: false }).addTo(S.map);
      lab._id = s.id; lab._rank = cs.state === "over" ? 5 + cs.diff : 1;
      S.labels.set(s.id, lab);
    });
    declutterLabels();
    return;
  }
  // Gauges at or above minor flood level (and the selected gauge) keep a visible label.
  const map = S.map;
  S.labels.forEach((l) => map.removeLayer(l));
  S.labels.clear();
  S.latest.stations.forEach((s) => {
    if (s.lat == null) return;
    const selected = s.id === S.selected;
    if (CLASSES[clsKey(s)].rank < 2 && !selected) return;
    const size = markerSize(s, selected);
    const html = `<span class="rw-label-in"><b class="num">${fmtH(s.height)} m</b> ${esc(s.place || s.name)}</span>`;
    const icon = L.divIcon({ className: `rw-label r-${clsKey(s)}${selected ? " sel" : ""}`, html, iconSize: null, iconAnchor: [-(size / 2 + 5), 12] });
    const lab = L.marker([s.lat, s.lon], { icon, pane: "labels", interactive: false, keyboard: false }).addTo(map);
    lab._id = s.id;
    lab._rank = (selected ? 10 : 0) + CLASSES[clsKey(s)].rank;
    S.labels.set(s.id, lab);
  });
  declutterLabels();
}

function declutterLabels() {
  // When labels collide, keep the selected gauge and the more serious flood class.
  const kept = [];
  [...S.labels.values()].sort((a, b) => b._rank - a._rank).forEach((lab) => {
    const el = lab.getElement();
    if (!el) return;
    el.classList.remove("collide");
    const r = el.firstElementChild?.getBoundingClientRect();
    if (!r || !r.width) return;
    const hit = kept.some((k) => r.left < k.right && r.right > k.left && r.top < k.bottom && r.bottom > k.top);
    if (hit) el.classList.add("collide"); else kept.push(r);
  });
}

function renderMap() {
  const map = S.map;
  S.chains.forEach((c) => map.removeLayer(c));
  S.chains = [];
  // On the outline map, join each waterway's gauges in bulletin order (BoM lists them upstream to
  // downstream). Real basemaps already show the rivers, so the joins are left off there.
  const byWater = new Map();
  if (S.basemap === "outline") S.latest.stations.forEach((s) => {
    if (s.lat == null) return;
    const k = `${s.group}|${s.waterway}`;
    if (!byWater.has(k)) byWater.set(k, []);
    byWater.get(k).push(s);
  });
  byWater.forEach((list) => {
    if (list.length < 2) return;
    const pts = list.sort((a, b) => a.order - b.order).map((s) => [s.lat, s.lon]);
    const line = L.polyline(pts, { pane: "chains", interactive: false, className: "rw-chain" }).addTo(map);
    line._stations = list.map((s) => s.id);
    S.chains.push(line);
  });

  const seen = new Set();
  S.latest.stations.forEach((s) => {
    if (s.lat == null) return;
    seen.add(s.id);
    const { html, size } = markerSvg(s, s.id === S.selected);
    const icon = L.divIcon({ html, className: markerClass(s), iconSize: [size, size], iconAnchor: [size / 2, size / 2] });
    const rank = CLASSES[clsKey(s)].rank;
    let m = S.markers.get(s.id);
    if (!m) {
      m = L.marker([s.lat, s.lon], { icon, title: s.name, alt: s.name, riseOnHover: true, keyboard: true }).addTo(map);
      m.on("click", () => select(s.id, { fromMap: true }));
      S.markers.set(s.id, m);
    } else { m.setLatLng([s.lat, s.lon]); m.setIcon(icon); }
    m.setZIndexOffset(rank * 1000 + (s.id === S.selected ? 10000 : 0));
    m.unbindTooltip();
    m.bindTooltip(tipHtml(s), { className: "rw-tip", direction: "top", offset: [0, -size / 2 - 2], opacity: 1 });
  });
  for (const [id, m] of S.markers) if (!seen.has(id)) { map.removeLayer(m); S.markers.delete(id); }
  renderLabels();
}

function tipHtml(s) {
  const key = clsKey(s);
  return `<div class="t-name">${esc(s.name)}</div>
    <div class="t-row"><span class="swatch sw-${key}"></span>${CLASSES[key].short} · <span class="num">${fmtH(s.height)} m ${esc(s.datum || "")}</span> ${s.tendency ? esc(s.tendency) : ""}</div>
    <div class="t-row">${esc(tFmt(s.time))}</div>`;
}

function applyFilters() {
  for (const [id, m] of S.markers) {
    const el = m.getElement();
    if (el) {
      const st = S.byId.get(id);
      el.classList.toggle("dim", S.view === "crossings"
        ? !(matchesPlace(st) && (st.crossings || []).some((c) => c.kind === "road"))
        : !matches(st));
      el.classList.toggle("ds", !!S.downstream?.has(id));

  }
  S.chains.forEach((c) => {
    const anyMatch = c._stations.some((id) => matches(S.byId.get(id)));
    const el = c.getElement && c.getElement();
    if (el) el.classList.toggle("dim", !anyMatch);
  });
  if (S.view === "rivers") renderRivers();
  else if (S.view === "crossings") renderCrossings();
}

function fitVisible() {
  const pts = S.latest.stations.filter((s) => s.lat != null && matches(s)).map((s) => [s.lat, s.lon]);
  const all = pts.length ? pts : S.latest.stations.filter((s) => s.lat != null).map((s) => [s.lat, s.lon]);
  if (all.length) S.map.fitBounds(all, { padding: [30, 30], maxZoom: 13 });
}

function renderLegend() {
  const dot = (key, t) => `<span class="shape">${markerGlyph(key, t, 18, false)}</span>`;
  const classes = ["major", "moderate", "minor", "below", "none"].map((k) =>
    `<div class="row">${dot(k)}${CLASSES[k].label}</div>`).join("");
  $("#legend").innerHTML = `${classes}<hr>
    <div class="row">${dot("below", "rising")}Rising</div>
    <div class="row">${dot("below", "falling")}Falling</div>
    <div class="row">${dot("below")}Steady or not reported</div>
    ${S.basemap === "outline" ? '<hr><div class="row"><svg class="shape" viewBox="0 0 18 18" aria-hidden="true"><path d="M1 9h16" stroke="var(--chain)" stroke-width="2.5"/></svg>Gauges joined downstream</div>' : ""}
    ${S.catchOn ? '<hr><div class="row"><span class="catch-key"></span>Catchment, shaded by its most serious gauge</div><div class="row"><span class="catch-key path"></span>Selected gauge\'s catchment and route</div>' : ""}`;
}

// ------------------------------------------------------------------ catchments overlay
// Queensland drainage sub-basins (Stanley, Lockyer, Bremer, Brisbane, Pine, Caboolture) and
// Brisbane City Council creek catchments, each shaded by the most serious flood class among
// its gauges. Selecting a gauge outlines the catchments its water passes through to the bay.
function inRing(x, y, ring) {

    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function inGeom(x, y, g) {
  const polys = g.type === "Polygon" ? [g.coordinates] : g.coordinates;
  return polys.some((p) => inRing(x, y, p[0]) && !p.slice(1).some((h) => inRing(x, y, h)));
}
function labelPoint(g) {
  // Area-weighted centroid of the largest ring: good enough to place a name.
  const polys = g.type === "Polygon" ? [g.coordinates] : g.coordinates;
  let best = null, bestA = 0;
  polys.forEach((p) => {
    const r = p[0];
    let a = 0, cx = 0, cy = 0;
    for (let i = 0; i < r.length - 1; i++) {
      const f = r[i][0] * r[i + 1][1] - r[i + 1][0] * r[i][1];
      a += f; cx += (r[i][0] + r[i + 1][0]) * f; cy += (r[i][1] + r[i + 1][1]) * f;
    }
    if (Math.abs(a) > bestA) { bestA = Math.abs(a); best = [cy / (3 * a), cx / (3 * a)]; }
  });
  return best;
}
function assignCatchments() {
  if (!S.catch) return;
  S.latest.stations.forEach((s) => {
    s._basin = s._creek = null;
    if (s.lat == null) return;
    s._basin = S.catch.basins.features.find((f) => inGeom(s.lon, s.lat, f.geometry)) || null;
    s._creek = S.catch.creeks.features.find((f) => inGeom(s.lon, s.lat, f.geometry)) || null;
  });
  [...S.catch.basins.features, ...S.catch.creeks.features].forEach((f) => {
    const key = f.properties.level === "basin" ? "_basin" : "_creek";
    const inside = S.latest.stations.filter((s) => s[key] === f);
    f._count = inside.length;
    f._worst = inside.reduce((a, s) => (CLASSES[clsKey(s)].rank > CLASSES[a].rank ? clsKey(s) : a), "none");
  });
}
// The drainage sub-basins group neighbouring catchments, so only a gauge on a sub-basin's main
// river (e.g. Lockyer Creek in the Lockyer sub-basin) can be traced on to the next river. For
// any other creek we say which sub-basin it is in and make no claim about its route.
function onMainRiver(s) {
  return !!(s && s._basin && s._basin.properties.mainRiver && s.waterway === s._basin.properties.mainRiver);
}
function basinChain(s) {
  const steps = [];
  if (!onMainRiver(s)) return s && s._basin ? [s._basin] : [];
  let f = s && s._basin;
  const seen = new Set();
  while (f && !seen.has(f)) {
    seen.add(f);
    steps.push(f);
    f = S.catch.basins.features.find((x) => x.properties.name === f.properties.into) || null;
  }
  return steps;
}
function downstreamOf(s) {
  const byOrder = (a, b) => a.order - b.order;
  // Same creek name in the same area or sub-basin (several creeks share names, e.g. Sandy Creek).
  const sameCreek = (x) => x.waterway === s.waterway && (x.group === s.group || (x._basin && x._basin === s._basin));
  const out = S.latest.stations.filter((x) => sameCreek(x) && x.order > s.order).sort(byOrder);
  const b = s._basin?.properties;
  if (b && b.receivingRiver && b.firstGauge && onMainRiver(s)) {
    const recv = S.latest.stations.filter((x) => x.waterway === b.receivingRiver).sort(byOrder);
    const start = recv.findIndex((x) => (x.place || "").startsWith(b.firstGauge));
    if (start >= 0) out.push(...recv.slice(start));
  }
  return out;
}
function renderCatchments() {
  const map = S.map;
  (S.catchLayers || []).forEach((l) => map.removeLayer(l));
  S.catchLayers = [];
  if (!S.catchOn || !S.catch || !S.latest) return;
  const sel = S.selected ? S.byId.get(S.selected) : null;
  const path = new Set(sel ? basinChain(sel) : []);
  if (sel && sel._creek) path.add(sel._creek);
  const style = (f) => ({
    className: `rw-catch ${f.properties.level} c-${f._count ? f._worst : "empty"}${path.has(f) ? " path" : ""}`,
  });
  const basins = L.geoJSON(S.catch.basins, { pane: "catchments", interactive: false, style }).addTo(map);
  const creeks = L.geoJSON(S.catch.creeks, { pane: "catchments", interactive: false, style }).addTo(map);
  S.catchLayers.push(basins, creeks);
  [...S.catch.basins.features, ...S.catch.creeks.features].forEach((f) => {
    const p = labelPoint(f.geometry);
    if (!p) return;
    const lvl = f.properties.level;
    const icon = L.divIcon({ className: `rw-catch-label ${lvl}${path.has(f) ? " path" : ""}`, html: `<span>${esc(f.properties.name)}</span>`, iconSize: null });
    S.catchLayers.push(L.marker(p, { icon, pane: "catchments", interactive: false, keyboard: false }).addTo(map));
  });
}
function setCatchments(on) {
  S.catchOn = on;
  try { localStorage.setItem("rw-catchments", on ? "1" : "0"); } catch (e) { /* storage blocked */ }
  $("#catch-btn").setAttribute("aria-pressed", on);
  renderCatchments();
  renderLegend();
}
function waterPathHtml(s) {
  if (!S.catch || !s._basin) return "";
  const chain = basinChain(s);
  const steps = [];
  if (s._creek) steps.push(`<li><b>${esc(s._creek.properties.name)}</b> catchment</li>`);
  if (!onMainRiver(s)) {
    steps.push(`<li><b>${esc(s.waterway)}</b><span class="flow-via">in the ${esc(s._basin.properties.name)} drainage sub-basin</span></li>`);
    chain.length = 0;
  }
  chain.forEach((f, i) => {
    const p = f.properties;
    const verb = /Bay$/.test(p.into || "") ? "flows into" : "joins the";
    steps.push(`<li><b>${esc(p.name)}</b> ${i === 0 && !s._creek ? "catchment" : ""}<span class="flow-via">${p.into ? `${verb} ${esc(p.into)}${p.via ? ` ${esc(p.via)}` : ""}` : ""}</span></li>`);
  });
  const last = chain[chain.length - 1]?.properties;
  if (last?.into && !S.catch.basins.features.some((x) => x.properties.name === last.into)) steps.push(`<li><b>${esc(last.into)}</b></li>`);
  const down = downstreamOf(s);
  const shown = down.slice(0, 8);
  const rows = shown.map((x) => {
    const key = clsKey(x);
    return `<li><button type="button" class="ds-row" data-id="${esc(x.id)}"><span class="swatch sw-${key}"></span><span class="ds-name">${esc(x.name)}</span><span class="num">${fmtH(x.height)} m</span>${pill(key)}</button></li>`;
  }).join("");
  return `<div>
    <h3 class="section-title">Where this water goes</h3>
    <ol class="flow">${steps.join("")}</ol>
    ${down.length ? `<p class="g-sub" style="margin:10px 0 4px">Gauges downstream, in order:</p><ol class="ds-list">${rows}</ol>${down.length > shown.length ? `<p class="g-sub" style="margin:4px 0 0">and ${down.length - shown.length} more further down.</p>` : ""}`
      : `<p class="g-sub" style="margin:8px 0 0">No gauges downstream of this one on ${esc(s.waterway)} in BoM's bulletins.</p>`}
  </div>`;
}

// ------------------------------------------------------------------ crossings
// BoM's bulletins say how far the water is above or below a bridge, road, causeway, weir or
// dam spillway at many gauges ("1.97 above Bridge"). The collector turns that into the
// feature's level on the gauge, so it can be compared with every new reading.
const NEAR_M = 0.5;
const CROSS_ICON = {
  road: '<path d="M1 10.5h14M2.5 10.5c0-3 2.4-5.5 5.5-5.5s5.5 2.5 5.5 5.5M5 7v3.5M11 7v3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
  storage: '<path d="M2 3v10h6V7.5M10.5 9.5c1.2-.9 2.3-.9 3.5 0M9 12.5c1.6-1 3.4-1 5 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
  tide: '<path d="M1 9c2-1.6 3.8-1.6 5.8 0S10.6 10.6 12.6 9 14.5 8 15 8M1 12.5c2-1.6 3.8-1.6 5.8 0s3.8 1.6 5.8 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
  other: '<circle cx="8" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/>',
};
const crossIcon = (kind) => `<svg class="cx-icon" viewBox="0 0 16 16" aria-hidden="true">${CROSS_ICON[kind] || CROSS_ICON.other}</svg>`;
const crossName = (c) => (/full supply/i.test(c.name) ? "Full supply level" : c.name.charAt(0).toUpperCase() + c.name.slice(1).toLowerCase());
function crossingState(s, c) {
  if (s.height == null) return { state: "unknown", diff: null };
  const diff = Math.round((s.height - c.level) * 100) / 100;
  if (diff >= 0) return { state: "over", diff };
  return { state: -diff <= NEAR_M ? "near" : "clear", diff };
}
function crossingPhrase(c, cs) {
  const what = /full supply/i.test(c.name) ? "full supply level" : `the ${c.name.toLowerCase()}`;
  if (cs.diff == null) return "No current reading";
  if (Math.abs(cs.diff) < 0.005) return `Water level with ${what}`;
  if (cs.diff > 0) return c.kind === "road" ? `Water ${cs.diff.toFixed(2)} m over ${what}` : `${cs.diff.toFixed(2)} m above ${what}`;
  return `${Math.abs(cs.diff).toFixed(2)} m below ${what}`;
}
const fmtDiff = (d) => (d == null ? "—" : `${d >= 0 ? "+" : "−"}${Math.abs(d).toFixed(2)}`);
function crossingTag(c, cs) {
  if (cs.state === "over") return `<span class="cx-tag over">${c.kind === "road" ? "Under water" : "Overflowing"}</span>`;
  if (cs.state === "near" && c.kind === "road") return `<span class="cx-tag near">Within ${NEAR_M} m</span>`;
  return "";
}
function allCrossings(filter = () => true) {
  const out = [];
  S.latest.stations.forEach((s) => (s.crossings || []).forEach((c) => {
    if (filter(s, c)) out.push({ s, c, cs: crossingState(s, c) });
  }));
  return out;
}
function roadsUnderWater() {
  return allCrossings((s, c) => c.kind === "road").filter((x) => x.cs.state === "over");
}
function matchesPlace(s) {
  if (S.area !== "all" && s.group !== S.area) return false;
  if (S.q) {
    const hay = lower(`${s.name} ${s.waterway} ${s.place} ${s.group}`);
    if (!S.q.split(/\s+/).every((w) => hay.includes(w))) return false;
  }
  return true;
}
function unusualNote(s) {
  const u = s.unusual;
  if (!u) return "";
  return `<p class="unusual"><b>Unusual reading.</b> ${u.change > 0 ? "Up" : "Down"} ${Math.abs(u.change).toFixed(2)} m since ${esc(tFmt(u.fromTime))} (${u.from.toFixed(2)} m). BoM's data isn't quality-checked, so this may be a gauge fault. Check <a href="${esc(s.links?.plot)}" target="_blank" rel="noopener">BoM's plot</a> before relying on it.</p>`;
}
function crossRow({ s, c, cs }) {
  return `<li><button type="button" class="cx-row ${cs.state}" data-id="${esc(s.id)}">
    <span class="cx-ic">${crossIcon(c.kind)}</span>
    <span class="cx-main"><b>${esc(crossName(c))}</b> at ${esc(s.place || s.name)}${s.unusual ? ' <span class="cx-tag check">Unusual reading</span>' : ""}<span class="cx-sub">${esc(s.waterway)} · ${esc(s.group)}${s.time ? ` · ${esc(tFmt(s.time))}` : ""}</span></span>
    <span class="cx-val"><span class="num">${fmtDiff(cs.diff)} m</span>${arrowSvg(s.tendency, "cx-arrow")}</span>
  </button></li>`;
}
function renderCrossings() {
  const view = $("#view");
  const list = allCrossings((s) => matchesPlace(s));
  const by = (st, kind) => list.filter((x) => x.cs.state === st && x.c.kind === kind).sort((a, b) => b.cs.diff - a.cs.diff);
  const roadOver = by("over", "road"), roadNear = by("near", "road");
  const roadClear = by("clear", "road"), roadUnknown = list.filter((x) => x.c.kind === "road" && x.cs.state === "unknown");
  const damOver = by("over", "storage");
  const damBelow = list.filter((x) => x.c.kind === "storage" && x.cs.state !== "over").sort((a, b) => (b.cs.diff ?? -99) - (a.cs.diff ?? -99));
  const section = (title, items, note) => items.length ? `<section class="cx-sec"><h2>${title} <span>${items.length}</span></h2>${note ? `<p class="g-sub">${note}</p>` : ""}<ol class="cx-list">${items.map(crossRow).join("")}</ol></section>` : "";
  const total = list.filter((x) => x.c.kind === "road").length;
  view.innerHTML = `
    <div class="cx-intro">
      <p class="cx-summary"><b>${roadOver.length}</b> of ${total} gauged bridges, roads and causeways ${roadOver.length === 1 ? "is" : "are"} under water${roadNear.length ? `, and <b>${roadNear.length}</b> ${roadNear.length === 1 ? "is" : "are"} within ${NEAR_M} m` : ""}.${(() => { const n = roadOver.filter((x) => x.s.unusual).length; return n ? ` ${n} of these ${n === 1 ? "is" : "are"} based on an unusual reading worth checking.` : ""; })()}</p>
      <p class="g-sub">These are the crossings at BoM gauges, with each level worked out from BoM's bulletins and compared with the latest reading. They're a guide only: other roads flood too, and a crossing can be unsafe before the water reaches it. Check road closures on <a href="https://qldtraffic.qld.gov.au/" target="_blank" rel="noopener">QLDTraffic</a> (13 19 40). Never drive through floodwater.</p>
    </div>
    ${roadOver.length ? section("Under water", roadOver) : `<p class="empty">No gauged crossings ${S.area !== "all" || S.q ? "in this selection " : ""}are under water at the latest readings.</p>`}
    ${section(`Within ${NEAR_M} m of the water`, roadNear)}
    ${section("Dams and weirs overflowing", damOver, "Water above the spillway, weir crest or full supply level.")}
    ${roadClear.length + roadUnknown.length ? `<details class="cx-more"><summary>Clear crossings (${roadClear.length + roadUnknown.length})</summary><ol class="cx-list">${[...roadClear, ...roadUnknown].map(crossRow).join("")}</ol></details>` : ""}
    ${damBelow.length ? `<details class="cx-more"><summary>Dams and weirs below their spillway (${damBelow.length})</summary><ol class="cx-list">${damBelow.map(crossRow).join("")}</ol></details>` : ""}`;
  view.querySelectorAll(".cx-row").forEach((b) => b.addEventListener("click", () => select(b.dataset.id)));
}
function stopCrossing(s) {
  const hits = (s.crossings || []).filter((c) => c.kind === "road").map((c) => ({ c, cs: crossingState(s, c) }))
    .filter((x) => x.cs.state === "over" || x.cs.state === "near").sort((a, b) => b.cs.diff - a.cs.diff);
  if (!hits.length) return "";
  const { c, cs } = hits[0];
  return `<span class="stop-cx ${cs.state}">${crossIcon(c.kind)}${esc(crossName(c))} ${fmtDiff(cs.diff)}</span>`;
}

// ------------------------------------------------------------------ rivers view
function relText(s) {
  const lv = s.levels || {};
  if (s.height == null || lv.minor == null) return "";
  const key = clsKey(s);
  const next = key === "below" ? ["minor", lv.minor] : key === "minor" ? ["moderate", lv.moderate] : key === "moderate" ? ["major", lv.major] : null;
  if (next && next[1] != null) {
    const d = next[1] - s.height;
    if (d >= 0) return `${d.toFixed(2)} m to ${next[0]}`;
  }
  const d = s.height - lv.minor;
  return `${d >= 0 ? "+" : "−"}${Math.abs(d).toFixed(2)} m vs minor`;
}

function renderRivers() {
  const L = S.latest;
  const parts = [];
  let shown = 0;
  for (const g of L.groups) {
    if (S.area !== "all" && g.name !== S.area) continue;
    const stations = g.stations.map((id) => S.byId.get(id)).filter(Boolean);
    const waters = [];
    const index = new Map();
    stations.forEach((s) => {
      if (!index.has(s.waterway)) { index.set(s.waterway, []); waters.push(s.waterway); }
      index.get(s.waterway).push(s);
    });
    const blocks = [];
    let groupFlood = 0;
    const stopHtml = (s, single) => {
      const key = clsKey(s);
      const label = `${s.name}: ${fmtH(s.height)} metres ${s.datum || ""}, ${CLASSES[key].label}${s.tendency ? ", " + s.tendency : ""}`;
      const name = single && s.place ? `<b>${esc(s.waterway)}</b> ${esc(s.place)}` : esc(s.place || s.name);
      return `<li class="stop${single ? " single" : ""}${s.id === S.selected ? " selected" : ""}${matches(s) ? "" : " dim"}" data-id="${esc(s.id)}">
        <button type="button" aria-label="${esc(label)}">
          <span class="stop-val">${fmtH(s.height)}${arrowSvg(s.tendency)}<small>${esc(s.datum || "")}</small></span>
          <span class="stop-track"><span class="node cls-${key}"></span></span>
          <span class="stop-name">${name}</span>
          <span class="stop-rel">${esc(relText(s))}</span>
          ${stopCrossing(s)}
        </button></li>`;
    };
    const worstOf = (list) => list.reduce((a, s) => (CLASSES[clsKey(s)].rank > CLASSES[a].rank ? clsKey(s) : a), "none");
    const head = (title, list, meta) => {
      const worst = worstOf(list);
      return `<div class="ww-head"><span class="ww-name">${esc(title)}</span>${CLASSES[worst].rank >= 2 ? pill(worst) : ""}<span class="ww-meta">${meta}</span></div>`;
    };
    const count = (list) => {
      groupFlood += list.filter((s) => CLASSES[clsKey(s)].rank >= 2).length;
      shown += list.filter(matches).length;
    };
    // Waterways with one gauge are gathered into a compact grid so long runs of small creeks stay scannable.
    let singles = [];
    const flushSingles = () => {
      const visible = singles.filter((s) => singles.length === 1 ? matches(s) : true);
      if (singles.length === 1 && visible.length) {
        const s = singles[0];
        count(singles);
        blocks.push(`<div class="waterway">${head(s.waterway, singles, "1 gauge")}<ol class="singles">${stopHtml(s, false)}</ol></div>`);
      } else if (singles.length > 1 && singles.some(matches)) {
        count(singles);
        blocks.push(`<div class="waterway">${head("Other creeks and storages", singles, `${singles.length} gauges, one per waterway`)}
          <ol class="singles">${singles.map((s) => stopHtml(s, true)).join("")}</ol></div>`);
      }
      singles = [];
    };
    for (const w of waters) {
      const list = index.get(w);
      if (list.length === 1) { singles.push(list[0]); continue; }
      flushSingles();
      if (!list.some(matches)) continue;
      count(list);
      blocks.push(`<div class="waterway">${head(w, list, `${list.length} gauges · upstream → downstream`)}
        <div class="line-scroll"><ol class="line">${list.map((s) => stopHtml(s, false)).join("")}</ol></div></div>`);
    }
    flushSingles();
    if (blocks.length) {
      parts.push(`<section class="area"><h2>${esc(g.name)}<span>${g.stations.length} gauges${groupFlood ? ` · ${groupFlood} at or above minor` : ""}</span></h2>${blocks.join("")}</section>`);
    }
  }
  const view = $("#view");
  if (!parts.length) {
    view.innerHTML = `<p class="empty">${S.floodOnly ? "No gauges are at or above minor flood level right now." : "No gauges match that search."}</p>`;
    return;
  }
  view.innerHTML = parts.join("");
  view.querySelectorAll(".stop").forEach((li) => li.querySelector("button").addEventListener("click", () => select(li.dataset.id)));
}

// ------------------------------------------------------------------ gauge view
function boardSvg(s, lv) {
  // A flood gauge board: coloured bands at BoM's minor / moderate / major levels, water up to the latest reading.
  const H = 210, W = 66, top = 8, bottom = H - 10, x0 = 30, bw = 16;
  const lvls = [lv.minor, lv.moderate, lv.major].filter((v) => v != null);
  const hi = Math.max(...lvls, s.height ?? -Infinity);
  const lo = Math.min(lv.minor - Math.max(1, (lvls[lvls.length - 1] - lv.minor) || 1), s.height ?? Infinity);
  const max = hi + Math.max(0.3, (hi - lo) * 0.08);
  const min = Math.floor(lo * 2) / 2;
  const y = (v) => bottom - ((v - min) / (max - min)) * (bottom - top);
  const bands = [
    ["below", min, lv.minor], ["minor", lv.minor, lv.moderate ?? lv.major ?? max],
    ["moderate", lv.moderate, lv.major ?? max], ["major", lv.major, max],
  ].filter(([, a, b]) => a != null && b != null && b > a);
  let out = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gauge board: ${fmtH(s.height)} metres against flood levels">`;
  bands.forEach(([k, a, b]) => {
    out += `<rect x="${x0}" y="${y(b)}" width="${bw}" height="${y(a) - y(b)}" fill="var(--st-${k})" opacity="${k === "below" ? 0.35 : 0.9}"/>`;
  });
  const step = max - min > 6 ? 1 : 0.5;
  for (let v = Math.ceil(min / step) * step; v <= max; v += step) {
    const yy = y(v);
    const major = Math.abs(v - Math.round(v)) < 1e-6;
    out += `<line x1="${x0 - (major ? 7 : 4)}" x2="${x0}" y1="${yy}" y2="${yy}" stroke="var(--ink-3)" stroke-width="1"/>`;
    if (major) out += `<text x="${x0 - 9}" y="${yy + 3.5}" text-anchor="end">${v.toFixed(0)}</text>`;
  }
  out += `<rect x="${x0}" y="${top}" width="${bw}" height="${bottom - top}" fill="none" stroke="var(--ink-2)" stroke-width="1"/>`;
  if (s.height != null) {
    const yh = y(s.height);
    out += `<rect x="${x0 + bw + 2}" y="${yh}" width="${W - x0 - bw - 2}" height="${bottom - yh}" fill="var(--water-fill)"/>`;
    out += `<path d="M${x0 - 4} ${yh} H${W}" stroke="var(--river)" stroke-width="2.5"/>`;
    out += `<path d="M${W} ${yh} l-6 -4 v8 z" fill="var(--river)"/>`;
  }
  return out + "</svg>";
}

function locationNote(s) {
  if (s.lat == null) return "This gauge has no published location, so it is not on the map.";
  if (s.coordAccuracy === "surveyed") return `Location: surveyed position from the ${esc(s.coordSource)}.`;
  if (s.coordAccuracy === "rounded") return "Location is approximate: BoM publishes this gauge's position rounded to the nearest minute, so the marker can be up to about 1 km from the gauge.";
  return `Location: BoM's published position (${esc(s.coordSource || "BoM")}), usually within about 100 m of the gauge.`;
}

function renderGauge() {
  const s = S.byId.get(S.selected);
  const view = $("#view");
  if (!s) { view.innerHTML = '<p class="empty">Select a gauge on the map or in the river list.</p>'; return; }
  const key = clsKey(s);
  const lv = s.levels || {};
  const hasLv = lv.minor != null;
  const classNote = s.classSource === "computed"
    ? "worked out from BoM's flood levels"
    : s.classTime && s.timeSource === "feed" ? `BoM, as at ${tFmt(s.classTime)}` : "as reported by BoM";
  const tendNote = s.tendencySource === "computed" ? " (last hour of readings)" : "";
  const floodRows = [["minor", lv.minor], ["moderate", lv.moderate], ["major", lv.major]].filter(([, v]) => v != null).map(([k, v]) => {
    const reached = s.height != null && s.height >= v;
    const diff = s.height == null ? "" : `${s.height >= v ? "+" : "−"}${Math.abs(s.height - v).toFixed(2)}`;
    return { level: v, html: `<tr class="${reached ? "reached" : ""}"><td><span class="lab"><span class="swatch sw-${k}"></span>${CLASSES[k].label}</span></td><td class="num">${v.toFixed(2)}</td><td class="num">${diff}</td></tr>` };
  });
  const crossings = (s.crossings || []).map((c) => ({ c, cs: crossingState(s, c) }));
  const crossFacts = crossings.filter(({ c }) => c.kind !== "tide" || crossings.length === 1)
    .map(({ c, cs }) => `<span class="cx-fact">${crossIcon(c.kind)}${esc(crossingPhrase(c, cs))}${crossingTag(c, cs)}</span>`);
  const crossRows = crossings.map(({ c, cs }) => ({ level: c.level, html:
    `<tr class="cx ${cs.state === "over" ? "reached" : ""}"><td><span class="lab">${crossIcon(c.kind)}${esc(crossName(c))}</span></td><td class="num">${c.level.toFixed(2)}</td><td class="num">${fmtDiff(cs.diff)}</td></tr>` }));

  view.innerHTML = `
    <button class="back" type="button" id="back">← All rivers</button>
    <div class="g-head">
      <div class="g-eyebrow">${esc(s.group)} · ${esc(s.type || "Gauge")} · No. ${esc(s.id)}</div>
      <h2 class="g-title">${esc(s.name)}</h2>
    </div>
    <div class="g-reading">
      ${hasLv ? `<div class="board">${boardSvg(s, lv)}</div>` : ""}
      <div class="g-figures">
        <div class="hero"><span class="v">${fmtH(s.height)}</span><span class="u">m ${esc(s.datum || "")}</span></div>
        <div>${pill(key)}</div>
        ${unusualNote(s)}
        <dl class="facts">
          <dt>Reading</dt><dd>${esc(tFmt(s.time))}${s.time ? ` · ${esc(ago(s.time))}` : ""}</dd>
          <dt>Tendency</dt><dd><span class="tend">${s.tendency ? `<svg viewBox="0 0 12 12" fill="var(--ink-2)">${tendencyPath(s.tendency)}</svg>${esc(s.tendency)}${tendNote}` : "Not reported"}</span></dd>
          <dt>Class</dt><dd>${esc(CLASSES[key].label)}${s.classSource ? ` · ${esc(classNote)}` : ""}</dd>
          ${crossFacts.length ? `<dt>Crossing</dt><dd class="cx-facts">${crossFacts.join("")}</dd>` : ""}
          <dt>Datum</dt><dd>${s.datum === "AHD" ? "AHD, roughly metres above mean sea level" : s.datum === "LGH" ? "Local gauge height (zero near the dry-weather low)" : "Not stated"}</dd>
        </dl>
      </div>
    </div>
    <div>
      <h3 class="section-title">${crossRows.length ? "Flood and crossing levels" : "Flood levels"}</h3>
      ${hasLv || crossRows.length ? `<table class="levels"><thead><tr><th>Level</th><th class="num">Height (m)</th><th class="num">Now vs level</th></tr></thead><tbody>${
        [...floodRows, ...crossRows].sort((a, b) => a.level - b.level).map((r) => r.html).join("")}</tbody></table>
        <p class="g-sub" style="margin:6px 0 0">${hasLv ? `Flood levels: ${esc(s.levelsSource || "BoM")}.` : "BoM's feed has no flood classification levels for this gauge."}${crossRows.length ? " Crossing levels: worked out from BoM's bulletin, which gives the water's height above or below each one; a guide only." : ""}</p>`
        : `<p class="g-sub" style="margin:0">BoM's feed has not supplied flood classification levels for this gauge. Many smaller gauges have none.</p>`}
    </div>
    <div>
      <div class="chart-head"><h3 class="section-title" style="margin:0">Water level</h3>
        <div class="seg" role="group" aria-label="Time range">
          ${[[24, "24 h"], [72, "3 days"], [168, "7 days"]].map(([h, l]) => `<button type="button" data-h="${h}" aria-pressed="${S.range === h}">${l}</button>`).join("")}
        </div></div>
      <div class="hydro" id="hydro"><div class="hydro-empty">Loading readings…</div></div>
      <details class="readings"><summary>Show readings as a table</summary><div class="readings-table" id="readings"></div></details>
    </div>
    ${waterPathHtml(s)}
    <div class="links">
      <a href="${esc(s.links?.plot)}" target="_blank" rel="noopener">BoM plot</a>
      <a href="${esc(s.links?.table)}" target="_blank" rel="noopener">BoM 7-day table</a>
      ${s.lat != null ? `<a href="https://www.openstreetmap.org/?mlat=${s.lat}&mlon=${s.lon}#map=15/${s.lat}/${s.lon}" target="_blank" rel="noopener">Open location in OpenStreetMap</a>` : ""}
    </div>
    <p class="g-sub" style="margin:0">${locationNote(s)}</p>`;

  $("#back").addEventListener("click", () => showView("rivers"));
  view.querySelectorAll(".ds-row").forEach((b) => b.addEventListener("click", () => select(b.dataset.id)));
  view.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => {
    S.range = +b.dataset.h;
    view.querySelectorAll(".seg button").forEach((x) => x.setAttribute("aria-pressed", x === b));
    drawHydro();
  }));
  loadHistory(s.id).then(() => { if (S.selected === s.id && S.view === "gauge") drawHydro(); });
}

function seriesFor(s) {
  const pts = (S.history?.series?.[s.id] || []).slice();
  if (!pts.length && s.spark?.length) return s.spark.slice();
  return pts;
}

function niceStep(span, target) {
  const raw = span / target;
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / p;
  return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * p;
}

function drawHydro() {
  const s = S.byId.get(S.selected);
  const el = $("#hydro");
  if (!s || !el) return;
  const all = seriesFor(s);
  const table = $("#readings");
  if (table) {
    const rowsHtml = all.slice(-150).reverse().map(([t, v]) => `<tr><td>${esc(fmtRow.format(minToDate(t)))}</td><td class="num">${v.toFixed(2)}</td></tr>`).join("");
    table.innerHTML = all.length ? `<table><thead><tr><th>Time (AEST)</th><th class="num">Height (m ${esc(s.datum || "")})</th></tr></thead><tbody>${rowsHtml}</tbody></table>` : '<p class="g-sub" style="padding:8px 10px;margin:0">No readings yet.</p>';
  }
  const endT = all.length ? all[all.length - 1][0] : Math.floor(nowMs() / 60000);
  const startT = endT - S.range * 60;
  const pts = all.filter((p) => p[0] >= startT);
  if (pts.length < 2) {
    el.innerHTML = `<div class="hydro-empty">${pts.length ? "Only one reading so far in this range." : "No readings in this range yet."} ${S.latest.demo
      ? "The sample snapshot only includes a 7-day history for Kedron Brook at Mitchelton. On the live site, every gauge builds up 7 days of 15-minute readings."
      : "History builds up automatically every 15 minutes, up to 7 days."}</div>`;
    return;
  }
  const vals = pts.map((p) => p[1]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const lv = s.levels || {};
  const span0 = Math.max(hi - lo, 0.2);
  const thr = [["minor", lv.minor], ["moderate", lv.moderate], ["major", lv.major]].filter(([, v]) => v != null);
  // Always show the minor flood level; higher levels only when they're within reach of the data.
  const inView = [];
  const offView = [];
  thr.forEach(([k, v], i) => {
    if (i === 0 || v <= hi + span0 * 1.5 || v <= Math.max(hi, lv.minor ?? hi) + 0.5) inView.push([k, v]); else offView.push([k, v]);
  });
  inView.forEach(([, v]) => { lo = Math.min(lo, v); hi = Math.max(hi, v); });
  // Crossing levels (bridges, roads, spillways): drawn when inside or near the chart's range, otherwise listed.
  const reach = Math.max((hi - lo) * 0.5, 1);
  (s.crossings || []).filter((c) => c.kind !== "tide").forEach((c) => {
    const near = c.level <= hi + reach && c.level >= lo - reach;
    (near ? inView : offView).push([`cx-${c.kind}`, c.level, crossName(c), c.level < lo ? "↓" : "↑"]);
  });
  inView.forEach(([, v]) => { lo = Math.min(lo, v); hi = Math.max(hi, v); });
  const refLabel = (k, v, label) => `${label || CLASSES[k].short} ${v.toFixed(2)}`;
  // Levels above the plotted range are listed in the top margin instead of squashing the trace.
  const W = Math.max(280, el.clientWidth || 380);
  const m = { l: 42, r: 98, t: 12 + offView.length * 14, b: 24 };
  const H = 220 + offView.length * 14;
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const pad = Math.max((hi - lo) * 0.08, 0.05);
  lo -= pad; hi += pad;
  const ys = (v) => m.t + ih - ((v - lo) / (hi - lo)) * ih;
  const xs = (t) => m.l + ((t - startT) / (endT - startT)) * iw;

  let svg = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Water level at ${esc(s.name)}, last ${S.range} hours">`;
  const step = niceStep(hi - lo, 4);
  svg += '<g class="grid axis">';
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
    svg += `<line x1="${m.l}" x2="${m.l + iw}" y1="${ys(v)}" y2="${ys(v)}"/><text x="${m.l - 6}" y="${ys(v) + 3.5}" text-anchor="end">${v.toFixed(step < 0.1 ? 2 : step < 1 ? 1 : 0)}</text>`;
  }
  // x ticks: local midnights (or every 6 hours on the 24 h view)
  const tickEvery = S.range <= 24 ? 360 : 1440;
  const offset = 600; // AEST, minutes
  for (let t = Math.ceil((startT + offset) / tickEvery) * tickEvery - offset; t <= endT; t += tickEvery) {
    const x = xs(t);
    const label = S.range <= 24 ? fmtHour.format(minToDate(t)).replace(/\s/g, "") : fmtDay.format(minToDate(t));
    svg += `<line x1="${x}" x2="${x}" y1="${m.t}" y2="${m.t + ih}"/><text x="${x}" y="${H - 6}" text-anchor="middle">${esc(label)}</text>`;
  }
  svg += `<line x1="${m.l}" x2="${m.l + iw}" y1="${m.t + ih}" y2="${m.t + ih}" style="stroke:var(--rule-strong)"/></g>`;

  // reference lines: flood levels (coloured) and crossings (dark, dashed); labels spaced so they never overlap
  svg += '<g class="thr">';
  const labels = inView.map(([k, v, label]) => ({ k, v, label, y: ys(v) })).sort((a, b) => a.y - b.y);
  for (let i = 1; i < labels.length; i++) labels[i].ly = Math.max(labels[i].y, (labels[i - 1].ly ?? labels[i - 1].y) + 12);
  if (labels.length) labels[0].ly = labels[0].y;
  const overflow = (labels.length ? labels[labels.length - 1].ly : 0) - (m.t + ih);
  if (overflow > 0) labels.forEach((l) => { l.ly -= overflow; });
  labels.forEach(({ k, v, label, y, ly }) => {
    const cx = k.startsWith("cx-");
    svg += `<line x1="${m.l}" x2="${m.l + iw}" y1="${y}" y2="${y}" class="${cx ? "ref-cx" : ""}" style="stroke:${cx ? "var(--ink)" : `var(--st-${k})`}"/>`;
    if (Math.abs(ly - y) > 1.5) svg += `<path d="M${m.l + iw} ${y} L${m.l + iw + 4} ${ly}" class="leader"/>`;
    svg += `<text x="${m.l + iw + 6}" y="${ly + 3.5}" style="fill:${cx ? "var(--ink)" : "var(--ink-2)"}">${esc(refLabel(k, v, label))}</text>`;
  });
  offView.forEach(([k, v, label, dir], i) => {
    svg += `<text x="${m.l + iw + 6}" y="${10 + i * 14}" style="fill:var(--ink-3)">${esc(refLabel(k, v, label))} ${dir || "↑"}</text>`;
  });
  svg += "</g>";

  // series, broken where readings are more than 6 hours apart
  const segs = [];
  let cur = [];
  pts.forEach((p, i) => {
    if (i && p[0] - pts[i - 1][0] > 360) { segs.push(cur); cur = []; }
    cur.push(p);
  });
  segs.push(cur);
  segs.forEach((seg) => {
    if (seg.length < 2) return;
    const d = seg.map((p, i) => `${i ? "L" : "M"}${xs(p[0]).toFixed(1)} ${ys(p[1]).toFixed(1)}`).join("");
    svg += `<path class="area" d="${d}L${xs(seg[seg.length - 1][0]).toFixed(1)} ${m.t + ih}L${xs(seg[0][0]).toFixed(1)} ${m.t + ih}Z"/>`;
    svg += `<path class="series" d="${d}"/>`;
  });
  const last = pts[pts.length - 1];
  svg += `<circle class="end-dot" cx="${xs(last[0])}" cy="${ys(last[1])}" r="4.5"/>`;
  const labelY = Math.min(Math.max(ys(last[1]) - 9, m.t + 8), m.t + ih - 4);
  svg += `<text class="end-label" x="${xs(last[0]) - 6}" y="${labelY}" text-anchor="end">${last[1].toFixed(2)}</text>`;
  svg += `<g class="cross" visibility="hidden"><line y1="${m.t}" y2="${m.t + ih}"/><circle class="hover-dot" r="4.5"/></g>`;
  svg += `<rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent" class="hit"/></svg>`;
  el.innerHTML = svg + '<div class="hydro-tip" hidden></div>';

  const svgEl = el.querySelector("svg");
  const cross = svgEl.querySelector(".cross");
  const tip = el.querySelector(".hydro-tip");
  const hit = svgEl.querySelector(".hit");
  const move = (ev) => {
    const r = svgEl.getBoundingClientRect();
    const x = ((ev.clientX - r.left) / r.width) * W;
    const t = startT + ((x - m.l) / iw) * (endT - startT);
    let best = pts[0];
    for (const p of pts) if (Math.abs(p[0] - t) < Math.abs(best[0] - t)) best = p;
    const cx = xs(best[0]), cy = ys(best[1]);
    cross.setAttribute("visibility", "visible");
    cross.querySelector("line").setAttribute("x1", cx); cross.querySelector("line").setAttribute("x2", cx);
    cross.querySelector("circle").setAttribute("cx", cx); cross.querySelector("circle").setAttribute("cy", cy);
    tip.hidden = false;
    const overs = (s.crossings || []).filter((c) => c.kind === "road" && best[1] >= c.level).map((c) => `${crossName(c)} +${(best[1] - c.level).toFixed(2)} m`);
    tip.innerHTML = `<span class="num">${best[1].toFixed(2)} m</span> · ${esc(fmtRow.format(minToDate(best[0])))}${overs.length ? `<br>${esc(overs.join(", "))}` : ""}`;
    const px = (cx / W) * r.width, py = (cy / H) * r.height - 10;
    tip.style.left = `${Math.min(Math.max(px, 70), r.width - 70)}px`;
    tip.style.top = `${Math.max(py, 24)}px`;
  };
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", () => { cross.setAttribute("visibility", "hidden"); tip.hidden = true; });
}

// ------------------------------------------------------------------ about
function renderAbout() {
  const L = S.latest;
  const src = L.sources || {};
  const st = (o) => (o == null ? "" : o.ok || o.available ? '<span class="src-ok">OK</span>' : '<span class="src-bad">unavailable</span>');
  const bulls = L.bulletins || (L.bulletin ? [L.bulletin] : []);
  const bullStatus = Object.entries(src.bulletins || {}).map(([id, b]) => `${esc(id)} ${st(b)}${b.issued ? ` (issued ${esc(tFmt(b.issued))})` : ""}`).join(" · ");
  const srcRows = L.demo ? "" : `<p>Last update: ${bullStatus || "bulletins unavailable"} · flood map ${st(src.mapPages)} · 15-minute readings ${st(src.observations)}.</p>`;
  $("#about").innerHTML = `
    <h2>About this data</h2>
    <p><b>Not an official warning.</b> For flood warnings, see <a href="https://www.bom.gov.au/qld/warnings/" target="_blank" rel="noopener">BoM Queensland warnings</a>. For SES help call 132 500. In a life-threatening emergency call 000.</p>
    <p>Heights come from the Bureau of Meteorology's river height bulletins ${bulls.map((b) => `${esc(b.product)} (${esc(shortTitle(b))})`).join(" and ") || "IDQ60286 and IDQ60285"} and its public data feed, refreshed about every 15 minutes. Most gauges are run by other agencies and report to BoM in real time; readings are not quality-checked and can be missing or wrong.</p>
    ${srcRows}
    <dl>
      <dt><span class="swatch sw-minor"></span>Minor</dt><dd>Low-lying land next to the waterway goes under; minor roads and low bridges may close.</dd>
      <dt><span class="swatch sw-moderate"></span>Moderate</dt><dd>As for minor, plus some buildings may flood above floor level and main roads may be cut. Evacuations may be needed.</dd>
      <dt><span class="swatch sw-major"></span>Major</dt><dd>Widespread flooding of towns or farmland. Properties and communities can be isolated and major roads close.</dd>
    </dl>
    <p>Heights are in metres on each gauge's own datum, so compare a gauge with its own flood levels, not with other gauges. Data © Bureau of Meteorology, CC BY 4.0 AU.</p>`;
}

// ------------------------------------------------------------------ navigation
function showView(v) {
  S.view = v;
  $("#tab-rivers").setAttribute("aria-selected", v === "rivers");
  $("#tab-gauge").setAttribute("aria-selected", v === "gauge");
  $("#tab-crossings").setAttribute("aria-selected", v === "crossings");
  $("#filters").hidden = v === "gauge";
  if (v === "rivers") renderRivers(); else if (v === "crossings") renderCrossings(); else renderGauge();
  if (v === "crossings") { try { history.replaceState(null, "", "#crossings"); } catch (e) { /* not available */ } }
  else if (v === "rivers") { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) { /* not available */ } }
  if (S.map) { renderLabels(); applyFilters(); }
  if (v !== "rivers") {
    const panel = $(".panel");
    if (getComputedStyle(panel).overflowY === "auto") panel.scrollTop = 0;
  }
  if (v === "rivers" && S.selected) {
    requestAnimationFrame(() => {
      const li = document.querySelector(`.stop[data-id="${CSS.escape(S.selected)}"]`);
      if (li) li.scrollIntoView({ block: "nearest", inline: "center" });
    });
  }
}

function select(id, { fromMap = false, keepView = false } = {}) {
  const prev = S.selected;
  S.selected = id;
  const s = S.byId.get(id);
  [prev, id].forEach((x) => {
    const st = S.byId.get(x);
    const mk = S.markers.get(x);
    if (st && mk) {
      const { html, size } = markerSvg(st, x === id);
      mk.setIcon(L.divIcon({ html, className: markerClass(st, x === id), iconSize: [size, size], iconAnchor: [size / 2, size / 2] }));
      mk.setZIndexOffset(CLASSES[clsKey(st)].rank * 1000 + (x === id ? 10000 : 0));
    }
  });
  renderLabels();
  S.downstream = new Set(s ? downstreamOf(s).map((x) => x.id) : []);
  renderCatchments();
  applyFilters();
  $("#tab-gauge").disabled = false;
  try { history.replaceState(null, "", `#g${id}`); } catch (e) { /* not available in every viewer */ }
  if (!keepView) showView("gauge");
  if (s && s.lat != null && !fromMap) {
    const ll = L.latLng(s.lat, s.lon);
    if (!S.map.getBounds().pad(-0.1).contains(ll) || S.map.getZoom() < 10.5) S.map.setView(ll, Math.max(S.map.getZoom(), 11));
  }
  if (window.matchMedia("(max-width: 860px)").matches && fromMap) $(".panel").scrollIntoView({ block: "start" });
}

// ------------------------------------------------------------------ boot
function index() {
  S.byId = new Map(S.latest.stations.map((s) => [s.id, s]));
  const sel = $("#area");
  const current = S.area;
  const bulls = S.latest.bulletins || [];
  const groupBulletin = (g) => S.byId.get(g.stations[0])?.bulletin;
  const opt = (g) => `<option value="${esc(g.name)}">${esc(g.name)}</option>`;
  sel.innerHTML = `<option value="all">All areas</option>` + (bulls.length > 1
    ? bulls.map((b) => `<optgroup label="${esc(shortTitle(b))}">${S.latest.groups.filter((g) => groupBulletin(g) === b.product).map(opt).join("")}</optgroup>`).join("")
    : S.latest.groups.map(opt).join(""));
  sel.value = S.latest.groups.some((g) => g.name === current) ? current : "all";
  S.area = sel.value;
}

function renderAll() {
  index();
  assignCatchments();
  renderHeader();
  renderMap();
  renderCatchments();
  renderAbout();
  applyFilters();
  if (S.view === "gauge" && S.selected) renderGauge();
}

async function refresh() {
  try {
    S.latest = await loadLatest();
    renderAll();
  } catch (e) { /* keep showing the last good data; the timestamp shows its age */ }
}

async function boot() {
  S.embedded = readEmbedded();
  try {
    S.geo = S.embedded?.geo || await fetch("geo/seq-base.json").then((r) => (r.ok ? r.json() : null)).catch(() => null);
  } catch (e) { S.geo = null; }
  try {
    S.catch = S.embedded?.catchments || await fetch("geo/catchments.json").then((r) => (r.ok ? r.json() : null)).catch(() => null);
  } catch (e) { S.catch = null; }
  try { S.catchOn = localStorage.getItem("rw-catchments") === "1"; } catch (e) { S.catchOn = false; }
  initMap();
  renderLegend();
  if (matchMedia("(max-width: 860px)").matches) $("#legend-box").open = false;
  try {
    S.latest = await loadLatest();
  } catch (e) {
    $("#view").innerHTML = `<div class="hydro-empty"><b>River heights haven't been collected yet.</b> The first update runs a few minutes after the site is set up. If this persists, check the "Update river heights" workflow on GitHub. (${esc(e.message)})</div>`;
    return;
  }
  renderAll();
  S.map.invalidateSize({ pan: false });
  fitVisible();
  if (S.catch) {
    $("#catch-btn").hidden = false;
    $("#catch-btn").setAttribute("aria-pressed", S.catchOn);
    $("#catch-btn").addEventListener("click", () => setCatchments(!S.catchOn));
  }
  $("#q").addEventListener("input", (e) => { S.q = lower(e.target.value.trim()); applyFilters(); });
  $("#area").addEventListener("change", (e) => {
    S.area = e.target.value; applyFilters(); fitVisible();
    const panel = $(".panel");
    if (getComputedStyle(panel).overflowY === "auto") panel.scrollTop = 0;
  });
  $("#tab-rivers").addEventListener("click", () => showView("rivers"));
  $("#tab-gauge").addEventListener("click", () => S.selected && showView("gauge"));
  $("#tab-crossings").addEventListener("click", () => showView("crossings"));
  const hash = location.hash.match(/^#g(\w+)$/);
  if (hash && S.byId.has(hash[1])) select(hash[1]);
  else showView(location.hash === "#crossings" ? "crossings" : "rivers");
  let resizeT;
  new ResizeObserver(() => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (S.view === "gauge") drawHydro(); }, 120); }).observe($(".panel"));
  if (!S.embedded) setInterval(refresh, REFRESH_MS);
}

boot();
})();
</script>
</body>
</html>
