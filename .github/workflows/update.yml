# Collects river heights from the Bureau of Meteorology and publishes the website.
# Runs about every 15 minutes. GitHub may start scheduled runs a few minutes late.
name: Update river heights

on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "collector/**"
      - ".github/workflows/update.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: river-watch-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: pages
        uses: actions/configure-pages@v5

      # Reads BoM's public feed (ftp.bom.gov.au/anon/gen/fwo) and continues the
      # 7-day history from the copy already published on the site.
      # If BoM can't be reached this step fails and the site keeps its last data.
      - name: Collect river heights from BoM
        run: python collector/collect.py --out site/data --previous "${{ steps.pages.outputs.base_url }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
