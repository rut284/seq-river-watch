# Collects river heights from the Bureau of Meteorology and publishes the website.
#
# Timing: GitHub starts scheduled workflows late or skips them when busy (on this repository
# they ran about every 4 hours instead of every 15 minutes). So each run ends by waiting until
# 15 minutes after it started and then starting the next run itself. The schedule below only
# restarts that chain if it ever stops. Only one run at a time: the concurrency group cancels
# any extra queued run, so the chain never doubles up (cancelled runs in the Actions list are
# normal).
name: Update river heights

on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
    inputs:
      delay:
        description: "Minutes from the start of this run to the next one"
        required: false
        default: "15"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "collector/**"
      - ".github/workflows/update.yml"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # lets the run start the next run

concurrency:
  group: river-watch-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      started: ${{ steps.clock.outputs.started }}
    steps:
      - id: clock
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: pages
        uses: actions/configure-pages@v5

      # Reads BoM's public feed (ftp.bom.gov.au/anon/gen/fwo) and continues the
      # 7-day history from the copy already published on the site.
      # If BoM can't be reached this step fails and the site keeps its last data.
      - name: Collect river heights from BoM
        run: python collector/collect.py --out site/data --previous "${{ steps.pages.outputs.base_url }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

  next:
    # Runs even if the update failed (e.g. BoM briefly unreachable), so the chain keeps going.
    # A run cancelled by hand stops the chain; the schedule restarts it later.
    needs: update
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait, then start the next update
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED: ${{ needs.update.outputs.started }}
          DELAY_MIN: ${{ github.event.inputs.delay || '15' }}
        run: |
          now=$(date +%s)
          started=${STARTED:-$now}
          delay=$(( ${DELAY_MIN%%.*} * 60 ))
          wait=$(( started + delay - now ))
          [ "$wait" -gt 1200 ] && wait=1200
          if [ "$wait" -gt 0 ]; then echo "Waiting ${wait}s"; sleep "$wait"; fi
          code=$(curl -sS -o response.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/update.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "GitHub answered $code"
          if [ "$code" != "204" ]; then cat response.txt; exit 1; fi
